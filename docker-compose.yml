services:
  app:
    build: .
    restart: unless-stopped
    environment:
      OPEN_THINGS_TOKEN: ${OPEN_THINGS_TOKEN:?set OPEN_THINGS_TOKEN in .env}
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
